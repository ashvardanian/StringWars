[package]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
categories = ["text-processing", "development-tools::profiling"]
description = "Comparing performance-oriented string-processing libraries for substring search, multi-pattern matching, hashing, edit-distances, sketching, and sorting across CPUs and GPUs in Rust 🦀"
edition = "2021"
homepage = "https://ashvardanian.com/posts/stringwars-on-gpus"
keywords = ["string", "benchmark", "simd", "gpu", "stringzilla"]
license = "Apache-2.0"
name = "stringwars"
readme = "README.md"
repository = "https://github.com/ashvardanian/StringWars"
# The standard `Allocator` API that places GPU batches in unified memory is stable since 1.100.
rust-version = "1.100"
version = "1.8.3"

# The harness is a real library target rather than a `#[path]` include, so it
# compiles once instead of ten times, `pub` means something, and the normative
# tokenizer can carry unit tests. `doc = false` keeps it off docs.rs: it is
# internal scaffolding, not part of what this crate publishes.
[lib]
name = "stringwars"
path = "stringwars.rs"
doc = false

[dependencies]
stringtape = "2.4.1"

# A local checkout overrides it through a `[patch]` table in the gitignored `.cargo/config.toml`.
stringzilla = { version = "6.0.0-rc.1", default-features = false }

# Feature-based dependencies for benchmarks
[features]
bench_containers = [
  "xxhash-rust", # xxh3_128 for the double-hashing baseline
  "fastbloom",   # SIMD Bloom filter with pluggable hasher
  "xorf",        # Binary-fuse filter built from pre-hashed u64 keys
]
bench_encryption = [
  "ring",        # Mozilla's AES-GCM, ChaCha20-Poly1305
  "openssl",     # OpenSSL's AES-GCM, ChaCha20-Poly1305
  "sodiumoxide", # SodiumOxide's ChaCha20-Poly1305
  "getrandom",   # OS random for key generation
  "rand",        # Random number generation for keys
]
bench_find = [
  "memchr",       # Substring search
  "bstr",         # Byteset search
  "aho-corasick", # Byteset search
]
bench_fingerprints = [
  "forkunion", # One window-overlap engine per pool thread
]
bench_hash = [
  "bit-set",      # for collision counting
  "ahash",        # aHash
  "xxhash-rust",  # xxHash
  "wyhash",       # wyhash
  "blake3",       # Blake3
  "murmurhash32", # MurmurHash32
  "foldhash",     # FoldHash
  "sha2",         # SHA256
  "ring",         # SHA256
  "cityhash",     # CityHash (x86_64 only)
]
bench_memory = [
  "rand",         # Randomize Buffer
  "zeroize",      # Obfuscate Buffer
  "getrandom",    # Randomize Buffer via OS
  "rand_chacha",  # Randomize Buffer
  "rand_xoshiro", # Randomize Buffer
  "arrow",        # Gathering a column into one tape
]
bench_normalization = [
  "icu",                   # Case mapping + NFC/NFD/NFKC/NFKD normalizers
  "unicase",               # Case-insensitive string wrapper
  "unicode-normalization", # NFC/NFD/NFKC/NFKD normalization baseline
  "pcre2",                 # Full Unicode case folding in regex (unlike `regex` crate)
  "memchr",                # Fast SIMD substring search (for ICU fold + search baseline)
]
bench_regex = [
  "aho-corasick", # Literal vocabularies only
  "fancy-regex",  # Lookarounds over the `regex` crate's engine
  "pcre2",        # Lookarounds in a backtracking JIT
  "forkunion",    # One regex engine per pool thread
]
bench_sequence = [
  "arrow",  # Sorting
  "polars", # DataFrame library with sorting (single-threaded in the bench)
]
bench_similarities = [
  "rapidfuzz", # Levenshtein distance
  "strsim",    # Levenshtein distance, the most depended-upon crate
  "bio",       # Needleman-Wunsch score
  "forkunion", # One edit-distance engine per pool thread
]
bench_subdocuments = [
  "serde_json",      # The DOM the JSONPath crates query
  "serde_json_path", # RFC 9535 JSONPath over `serde_json`
  "jsonpath-rust",   # JSONPath over `serde_json`
  "sonic-rs",        # SIMD JSON with pointer lookups
  "simd-json",       # simdjson's port, for pointer lookups
  "sxd-document",    # The XML DOM `sxd-xpath` queries
  "sxd-xpath",       # XPath 1.0
  "forkunion",       # One path engine per pool thread
]
bench_substrings = [
  "aho-corasick", # Reference multi-pattern automaton, DFA and contiguous NFA
  "daachorse",    # Double-array Aho-Corasick, the analog of our cold tier
  "bm25",         # Index-then-query scorer, for the scoring regime we do not occupy
  "forkunion",    # One multi-pattern engine per pool thread
]
bench_tokenization = [
  "icu",                  # Unicode properties, TR29 word/grapheme/sentence + UAX#14 line segmentation
  "simdutf",              # SIMD UTF-8 validation and transcoding
  "unicode-segmentation", # UAX#29 word/grapheme/sentence segmentation
  "unicode-linebreak",    # UAX#14 line-break opportunity segmentation
]
cuda = ["stringzilla/cuda"]
default = ["stringzilla/std"]

# TODO: String properties:
# - `unicode-width`
# - `textwrap`

[dependencies.memchr]
default-features = false
optional = true
version = "2.8.3"

[dependencies.bio]
default-features = false
features = ["runtime-dispatch-simd"]
optional = true
version = "4.0.1"

[dependencies.bm25]
# `default_tokenizer` is the point of the comparison: an inverted index needs tokens, and building
# them is the cost this engine does not pay.
optional = true
version = "2.3.2"

[dependencies.bstr]
default-features = false
optional = true
version = "1.13.0"

[dependencies.daachorse]
optional = true
version = "5.0.0"

[dependencies.aho-corasick]
optional = true
version = "1.1.4"

[dependencies.icu]
default-features = false
features = ["compiled_data"]
optional = true
version = "2.2.0"

[dependencies.simdutf]
optional = true
version = "0.7"

[dependencies.unicase]
optional = true
version = "2.9"

[dependencies.unicode-segmentation]
optional = true
version = "1.13"

[dependencies.unicode-linebreak]
optional = true
version = "0.1.5"

[dependencies.unicode-normalization]
optional = true
version = "0.1.25"

[dependencies.regex]
optional = false
version = "1.13.1"

[dependencies.pcre2]
optional = true
version = "0.2.11"

[dependencies.rapidfuzz]
optional = true
version = "0.5.0"

[dependencies.strsim]
optional = true
version = "0.11.1"

[dependencies.forkunion]
optional = true
version = "4.0.0-rc.1"

[dependencies.fancy-regex]
optional = true
version = "0.19.2"

[dependencies.serde_json]
optional = true
version = "1.0.154"

[dependencies.serde_json_path]
optional = true
version = "0.7.2"

[dependencies.jsonpath-rust]
optional = true
version = "1.0.12"

[dependencies.sonic-rs]
optional = true
version = "0.5.10"

[dependencies.simd-json]
optional = true
version = "0.18.1"

[dependencies.sxd-document]
optional = true
version = "0.3.2"

[dependencies.sxd-xpath]
optional = true
version = "0.4.2"

[dependencies.blake3]
optional = true
version = "1.8.5"

[dependencies.sha2]
optional = true
version = "0.11"

[dependencies.ring]
optional = true
version = "0.17"

[dependencies.openssl]
optional = true
version = "0.10.81"

[dependencies.sodiumoxide]
optional = true
version = "0.2"

[dependencies.toml]
version = "0.8"

[dependencies.crc32fast]
version = "1.5.0"

[dependencies.murmurhash32]
optional = true
version = "0.4"

[dependencies.foldhash]
optional = true
version = "0.2"

[dependencies.ahash]
optional = true
version = "0.8.12"

[dependencies.xxhash-rust]
features = ["xxh3", "const_xxh3"]
optional = true
version = "0.8.18"

[dependencies.wyhash]
optional = true
version = "0.6"

[dependencies.twox-hash]
optional = true
version = "2.1.3"

[dependencies.arrow]
optional = true
version = "59.1.0"

[dependencies.fastbloom]
optional = true
version = "0.17"

[dependencies.xorf]
optional = true
version = "0.12"

[dependencies.rayon]
optional = true
version = "1.10.0"

[dependencies.polars]
default-features = false
features = ["lazy", "strings", "parquet", "regex", "timezones", "temporal"]
optional = true
version = "0.54"

[dependencies.zeroize]
optional = true
version = "1.9.0"

[dependencies.getrandom]
optional = true
version = "0.3.4"

[dependencies.rand]
optional = true
version = "0.10.2"

[dependencies.rand_chacha]
optional = true
version = "0.10.0"

[dependencies.rand_xoshiro]
optional = true
version = "0.8.1"

[dependencies.bit-set]
optional = true
version = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.177"
perf-event = "0.4"

[target.'cfg(target_arch = "x86_64")'.dependencies]
cityhash = { version = "0.1", optional = true }

[[bench]]
harness = false
name = "bench_find"
path = "find/bench.rs"
required-features = ["bench_find"]

[[bench]]
harness = false
name = "bench_tokenization"
path = "tokenization/bench.rs"
required-features = ["bench_tokenization"]

[[bench]]
harness = false
name = "bench_normalization"
path = "normalization/bench.rs"
required-features = ["bench_normalization"]

[[bench]]
harness = false
name = "bench_similarities"
path = "similarities/bench.rs"
required-features = ["bench_similarities"]

[[bench]]
harness = false
name = "bench_hash"
path = "hash/bench.rs"
required-features = ["bench_hash"]

[[bench]]
harness = false
name = "bench_sequence"
path = "sequence/bench.rs"
required-features = ["bench_sequence"]

[[bench]]
harness = false
name = "bench_containers"
path = "containers/bench.rs"
required-features = ["bench_containers"]

[[bench]]
harness = false
name = "bench_memory"
path = "memory/bench.rs"
required-features = ["bench_memory"]

[[bench]]
harness = false
name = "bench_fingerprints"
path = "fingerprints/bench.rs"
required-features = ["bench_fingerprints"]

[[bench]]
harness = false
name = "bench_encryption"
path = "encryption/bench.rs"
required-features = ["bench_encryption"]

[[bench]]
harness = false
name = "bench_substrings"
path = "substrings/bench.rs"
required-features = ["bench_substrings"]

[[bench]]
harness = false
name = "bench_regex"
path = "regex/bench.rs"
required-features = ["bench_regex"]

[[bench]]
harness = false
name = "bench_subdocuments"
path = "subdocuments/bench.rs"
required-features = ["bench_subdocuments"]

[profile.release]
# Incremental release builds: after the first full optimize, editing a single bench.rs
# recompiles only the changed codegen units instead of the whole crate, cutting the
# measurement-build turnaround. Dependency crates (where the kernels live) stay fully cached.
incremental = true
