[project]
authors = [
  { name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com" },
]
description = "Comparing performance-oriented string-processing libraries for substring search, multi-pattern matching, hashing, edit-distances, sketching, and sorting across CPUs and GPUs in Python 🐍"
license = { text = "Apache 2.0" }
name = "stringwars"
readme = "README.md"
requires-python = ">=3.13"
version = "1.8.3"

dependencies = []

[project.urls]
Homepage = "https://ashvardanian.com/posts/stringwars-on-gpus"
Repository = "https://github.com/ashvardanian/StringWars"

# One group per suite, run as `uv run --group <suite> <suite>/bench.py`; exact versions live in `uv.lock`
[dependency-groups]
containers = ["stringzilla>=6.0.0-rc.1", "numpy>=2.5.1", "pyprobables>=0.7.0", "xxhash>=3.8.1"]
encryption = ["stringzilla>=6.0.0-rc.1", "cryptography>=49.0.0", "pycryptodome>=3.23.0", "pynacl>=1.6.2"]
find = ["stringzilla>=6.0.0-rc.1", "pyahocorasick>=2.3.1"]
fingerprints = ["stringzilla>=6.0.0-rc.1", "numpy>=2.5.1", "scikit-learn>=1.9.0"]
hash = [
  "stringzilla>=6.0.0-rc.1",
  "blake3>=1.0.9",
  "cityhash>=0.4.10",
  "google-crc32c>=1.8.0",
  "mmh3>=5.2.1",
  "numpy>=2.5.1",
  "xxhash>=3.8.1",
]
memory = ["stringzilla>=6.0.0-rc.1", "numpy>=2.5.1", "opencv-python>=5.0.0.93", "pyarrow>=25.0.0", "pycryptodome>=3.23.0"]
normalization = ["stringzilla>=6.0.0-rc.1", "pyicu>=2.16.2", "pyunormalize>=17.0.0", "regex>=2025.11.3"]
regex = ["stringzilla>=6.0.0-rc.1", "google-re2>=1.1.20251105", "hyperscan>=0.9.1", "numpy>=2.5.1", "regex>=2025.11.3"]
sequence = ["stringzilla>=6.0.0-rc.1", "numpy>=2.5.1", "pandas>=3.0.3", "polars>=1.43.0", "pyarrow>=25.0.0"]
similarities = [
  "stringzilla>=6.0.0-rc.1",
  "biopython>=1.87",
  "editdistance>=0.8.1",
  "edlib>=1.3.9.post1",
  "jellyfish>=1.2.1",
  "levenshtein>=0.27.3",
  "nltk>=3.10.0",
  "numpy>=2.5.1",
  "polyleven>=0.11.0",
  "rapidfuzz>=3.14.5",
]
subdocuments = [
  "stringzilla>=6.0.0-rc.1",
  "jsonpath-ng>=1.10.1",
  "lxml>=6.1.3",
  "numpy>=2.5.1",
  "orjson>=3.13.0",
  "pysimdjson>=7.0.2",
]
substrings = [
  "stringzilla>=6.0.0-rc.1",
  "ahocorasick-rs>=1.0.3",
  "bm25s>=0.3.10",
  "numpy>=2.5.1",
  "pyahocorasick>=2.3.1",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.9.0",
]
tokenization = ["stringzilla>=6.0.0-rc.1", "grapheme>=0.6.0", "pyicu>=2.16.2", "regex>=2025.11.3", "uniseg>=0.10.1"]

# Installs `stringwars.py` editable, so every `<suite>/bench.py` imports it without path edits
[tool.hatch.build.targets.wheel]
only-include = ["stringwars.py"]

[tool.ruff]
# Enforce 120-column lines across formatting and linting
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = [
  # Allow module-level prints in bench scripts
  "T201",
]
select = [
  "E",  # pycodestyle (errors)
  "W",  # pycodestyle (warnings)
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "B",  # flake8-bugbear
]

[tool.ruff.lint.isort]
# Group the local `stringwars` module into its own final import block
known-first-party = ["stringwars"]
# The `regex` package, not the `regex/` suite directory that shares its name
known-third-party = ["regex"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "preserve"
skip-magic-trailing-comma = false

# If you prefer Black interoperability, mirror line length
[tool.black]
line-length = 120
target-version = ["py313"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.21.1"]
