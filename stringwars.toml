# Shared defaults for both harnesses. `stringwars.rs` and `stringwars.py` hold none of their own,
# so everything below cannot drift between the two.
#
# Two per-suite fixtures are not here yet and are still mirrored by hand: `NGRAM_WIDTHS`
# (fingerprints) and `NEEDLES_PER_PASS` (normalization) each exist as a Rust `const` and a
# Python module constant. They agree today, so the drift is latent rather than live.

[limits]
# Working-set size: the bytes read from the start of the dataset, rounded down to a
# power of two as StringZilla's benchmarks do, so `STRINGWARS_BYTES` means the same in both.
#
# Two things bound this, and they pull against each other:
#
#   residency — a working set below the last-level cache measures the cache, not the
#     memory hierarchy. A Xeon 8480+ has 105 MB of L3 and a Zen5 X3D part has more
#     than 500 MB, so no fixed number is "past cache" everywhere. Portability is the
#     reason this is not tuned per machine: a machine-derived size would also make
#     the identity CRC machine-dependent and destroy the cross-machine check.
#
#   collectability — a pass must be short enough that the slowest contender in the
#     suite yields `min_samples` inside `time_limit`. The ceiling is roughly
#     `slowest_rate * min_measure_time * min_samples`, and for a 10 MB/s pure-Python
#     baseline that is tens of megabytes, not hundreds.
#
# Where the two conflict, collectability wins and the suite carries its own `bytes`
# below with the reason. Do not read the global value as a residency guarantee: it
# is not one for `sequence`, `normalization`, `tokenization` or `fingerprints`.
#
# `similarities` is a third case. A 100x100 Levenshtein pair does 10,000 cell updates
# over 200 input bytes, so the inputs belong in L1 and the DP band is the real
# working set. There `bytes` bounds only the pool a batch is drawn from and is not
# the denominator of anything.
bytes = "256MB"

# A sample is one or more complete passes over the working set. It must last long
# enough that the two clock reads bracketing it are noise: 2 x ~25ns / 1ms = 0.005%.
min_sample_time = "1ms"

# Below ~10 samples a dispersion estimate is meaningless.
min_samples = 10
min_measure_time = "1s"
time_limit = "10s"

# Seed of the drawn inputs, like `normalization`'s needles. `STRINGWARS_SEED=random` draws one.
seed = 42

# The smallest claim the READMEs make is "1.2x"; distinguishing that from 1.0x
# needs a few percent per side.
target_spread = 0.025
warmup = "1s"

# `dataset` and `tokens` are what a suite runs on when STRINGWARS_DATASET and
# STRINGWARS_TOKENS are unset, and record what its published numbers were taken
# with. Suites whose tables have several dataset columns name the first one here.
# `bytes` overrides the global size where a pass would otherwise be too slow to
# collect `min_samples` inside `time_limit`. `batch_per_core` is the
# default of `STRINGWARS_BATCH_PER_CORE` in the suites that read it.
[suite]
containers = { dataset = "data/xlsum/xlsum.csv", tokens = "words" }
find = { dataset = "data/xlsum/xlsum.csv", tokens = "words" }
hash = { dataset = "data/xlsum/xlsum.csv", tokens = "words" }
memory = { dataset = "data/xlsum/xlsum.csv", tokens = "lines" }
encryption = { dataset = "data/acgt/acgt_100.txt", tokens = "lines" }
# A cross-product touches `2 * side` tokens - 32 at the default pairs per batch - so the
# pool only has to be large enough to draw a batch from. Tokens stay in file order,
# so a smaller pool hands the kernels byte-identical inputs while dropping a 256 MB
# read, a CRC over 2.56 M tokens, and a 256 MB unified allocation. `bytes` here
# bounds the pool; it is not the denominator of anything. 256 pairs per core is the
# measured GPU saturation knee for short-word edit distance.
similarities = { dataset = "data/acgt/acgt_100.txt", tokens = "words", bytes = "8MB", batch_per_core = 256 }

# Sorting is O(N log N) and the slowest engine here runs ~110 M compares/s, so a
# 256MB pass would be tens of seconds.
sequence = { dataset = "data/xlsum/xlsum.csv", tokens = "lines", bytes = "32MB" }

# Compute-bound: five dictionary slices times five verbs times every device each pay their own
# passes, so the suite reads the 64MB slice it was written against rather than the global size.
substrings = { dataset = "data/xlsum/xlsum.csv", tokens = "lines", bytes = "64MB" }

# Compute-bound for the same reason: three vocabularies × four verbs × every device.
#
# The literal and lookaround vocabularies are news words and figures, so `xlsum` stays the default.
# The plain vocabulary's emails, URLs and log lines are denser in these, described in `regex/README.md`:
#   data/rebar/lh3lh3-reb-howto.txt              39,422,105 bytes
#   data/rebar/mariomka.txt                       6,839,410 bytes
#   data/rebar/opensubtitles-en-sampled.txt         899,232 bytes
#   data/loghub-openstack/openstack.log           5,394,691 bytes compressed
regex = { dataset = "data/xlsum/xlsum.csv", tokens = "lines", bytes = "64MB" }

# One GH Archive hour, a JSON event per line. The XML paths run over a Stack Exchange `Posts.xml`
# instead, whose `<row>` lines are documents of their own: point STRINGWARS_DATASET at
# `data/stackexchange-bioinformatics/Posts.xml`. The extension picks the format.
#
# Corpora that need vocabularies of their own, and a correctness suite, described in `subdocuments/README.md`:
#   data/jsonbench-bluesky/file_0001.json       135,176,827 bytes compressed
#   data/xmark/standard.xml                      37,924,307 bytes compressed, one document under `tokens = "file"`
#   data/jsonpath-compliance/cts.json               236,904 bytes, RFC 9535 queries with expected results
subdocuments = { dataset = "data/gharchive/2024-01-01-15.json", tokens = "lines", bytes = "64MB" }

# Whole-corpus passes over one `file`-mode token, so `bytes` is also the length of the
# single string every engine is handed.
#
# `pyunormalize` sets this one: it holds ~53 MChar/s up to 800 K characters and then falls
# off a cliff — 1.02 M characters did not finish in 295 s, a >20,000x collapse. A size
# above that ceiling cannot produce a number for it at all, and the too-slow refusal is no
# help because it only fires *after* one pass has completed. 512KB keeps the whole field
# collectable: pure ASCII yields 512 K characters and multi-byte scripts fewer still.
normalization = { dataset = "data/leipzig-1m/leipzig1M_en.txt", tokens = "file", bytes = "512KB" }
tokenization = { dataset = "data/leipzig-1m/leipzig1M_en.txt", tokens = "file", bytes = "16MB" }

# `serial::window_overlap` scores every query against every candidate, which puts the
# collectability ceiling near 1 MB — far below anything resident. This is the widest gap
# in the repo and the clearest case of collectability overriding residency. 128 documents
# per core already saturates it.
#
# `acgt` lines are random and hold no near-duplicates; one corpus with labelled ones, described in
# `fingerprints/README.md`:
#   data/core-deduplication/train.jsonl         203,599,780 bytes
fingerprints = { dataset = "data/acgt/acgt_100.txt", tokens = "lines", bytes = "1MB", batch_per_core = 128 }
